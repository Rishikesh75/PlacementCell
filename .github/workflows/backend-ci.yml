name: Backend CI

on:
  pull_request:
    paths:
      - "PlacementicsBackend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "PlacementicsBackend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: PlacementicsBackend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests package

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t placementics-backend .
        working-directory: PlacementicsBackend
