name: Generate OpenAPI Documentation

on:
  push:
    paths:
      - "PlacementicsBackend/**"
      - ".github/workflows/openapi-docs.yml"
  pull_request:
    paths:
      - "PlacementicsBackend/**"
      - ".github/workflows/openapi-docs.yml"

permissions:
  contents: write

concurrency:
  group: openapi-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: placementics
          POSTGRES_USER: placementics
          POSTGRES_PASSWORD: placementics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U placementics -d placementics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: PlacementicsBackend

    env:
      SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/placementics
      SUPABASE_DB_USERNAME: placementics
      SUPABASE_DB_PASSWORD: placementics
      MONGODB_URI: mongodb://localhost:27017/placement_db
      MONGODB_DATABASE: placement_db
      JPA_DDL_AUTO: update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: PlacementicsBackend/pom.xml

      - name: Build backend
        run: mvn -B -DskipTests package

      - name: Start backend for OpenAPI generation
        run: |
          JAR_FILE="$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR_FILE"
          nohup java -jar "$JAR_FILE" --server.port=8080 > /tmp/placementics-backend.log 2>&1 &
          echo $! > /tmp/placementics-backend.pid

      - name: Export and validate OpenAPI JSON
        run: |
          mkdir -p ../docs/api
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/v3/api-docs -o ../docs/api/openapi.json; then
              break
            fi
            sleep 2
          done
          test -s ../docs/api/openapi.json
          jq -e '.openapi and .paths' ../docs/api/openapi.json > /dev/null

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: placementcell-openapi
          path: docs/api/openapi.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed spec on branch pushes
        if: github.event_name == 'push'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          if git diff --cached --quiet; then
            echo "OpenAPI specification has not changed."
            exit 0
          fi
          git commit -m "docs(api): refresh generated OpenAPI specification [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Show backend logs if generation fails
        if: failure()
        working-directory: .
        run: |
          if [ -f /tmp/placementics-backend.log ]; then
            tail -n 200 /tmp/placementics-backend.log
          fi
