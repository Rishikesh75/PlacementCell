spring.application.name=PlacementicsBackend

# Optional .env in the working directory (KEY=VALUE). OS env vars also work.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL (Supabase) ---
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# --- MongoDB ---
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:placement_db}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true

# --- JPA ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}

# --- Cloudflare R2 (public college images) ---
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:https://pub-3c2ed3a3dd204d8ca46450be71237c03.r2.dev}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.example.placementicsbackend.controllers
